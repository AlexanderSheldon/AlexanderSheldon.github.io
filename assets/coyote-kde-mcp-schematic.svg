    <circle cx="126" cy="387" r="8"/><circle cx="173" cy="298" r="8"/><circle cx="230" cy="261" r="8"/>
    <circle cx="277" cy="342" r="8"/><circle cx="320" cy="247" r="8"/><circle cx="343" cy="383" r="8"/>
    <circle cx="418" cy="293" r="8"/><circle cx="474" cy="365" r="8"/><circle cx="449" cy="430" r="8"/>
    <circle cx="369" cy="475" r="8"/><circle cx="257" cy="463" r="8"/><circle cx="174" cy="433" r="8"/>
    <circle cx="217" cy="383" r="8"/><circle cx="394" cy="351" r="8"/>
  </g>
  <line x1="85" y1="514" x2="116" y2="514" stroke="#e8644b" stroke-width="3"/>
  <text x="127" y="519" fill="#5d6966" font-family="Manrope, sans-serif" font-size="12">convex hull around all points</text>
  <text x="649" y="191" fill="#172426" font-family="DM Mono, monospace" font-size="14">02 / KDE</text>
  <text x="649" y="218" fill="#5d6966" font-family="Manrope, sans-serif" font-size="13">Relative intensity; clusters form denser regions</text>
  <path d="M685 385 C699 331 736 293 786 279 C816 231 879 234 914 270 C956 246 1019 273 1027 318 C1080 341 1081 402 1041 429 C1025 478 964 492 923 463 C879 493 815 475 796 440 C748 454 694 430 685 385 Z" fill="#17645a" fill-opacity=".07"/>
  <path d="M715 382 C728 341 759 316 799 305 C828 270 870 272 901 300 C943 274 988 293 1002 327 C1043 343 1048 389 1017 416 C1000 451 956 460 922 438 C883 462 831 448 816 421 C773 433 728 414 715 382 Z" fill="#17645a" fill-opacity=".10" stroke="#17645a" stroke-opacity=".55" stroke-width="2"/>
  <path d="M759 376 C770 346 797 330 826 326 C848 301 879 304 899 327 C927 308 964 321 975 347 C1005 360 1007 391 985 409 C968 433 934 434 911 418 C883 435 844 424 833 404 C800 413 770 399 759 376 Z" fill="#d3ef4c" fill-opacity=".27" stroke="#17645a" stroke-width="2"/>
