<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Conceptual comparison of MCP and KDE home-range methods</title>
  <desc id="desc">The same illustrative location pattern is shown in two panels. Minimum Convex Polygon connects the outermost points into one envelope. Kernel Density Estimation shows nested density contours around clusters. This is a schematic, not a map or result from the coyote collar data.</desc>
  <rect width="1200" height="630" fill="#f2f2ec"/>
  <text x="58" y="54" fill="#17645a" font-family="DM Mono, monospace" font-size="15" letter-spacing="1">HOME-RANGE ESTIMATORS</text>
  <text x="58" y="91" fill="#172426" font-family="Manrope, sans-serif" font-size="29" font-weight="700">One set of locations, two spatial summaries</text>
  <text x="58" y="119" fill="#5d6966" font-family="Manrope, sans-serif" font-size="14">Conceptual diagram only &#183; not derived from the project collar data</text>
  <rect x="58" y="153" width="520" height="408" fill="#fbfbf8" stroke="#c9d0ca"/>
  <rect x="622" y="153" width="520" height="408" fill="#fbfbf8" stroke="#c9d0ca"/>
  <text x="85" y="191" fill="#172426" font-family="DM Mono, monospace" font-size="14">01 / MCP</text>
  <text x="85" y="218" fill="#5d6966" font-family="Manrope, sans-serif" font-size="13">Outer extent; extreme fixes define the envelope</text>
  <path d="M126 387 L173 298 L230 261 L320 247 L418 293 L474 365 L449 430 L369 475 L257 463 L174 433 Z" fill="#e8644b" fill-opacity=".08" stroke="#e8644b" stroke-width="3"/>
