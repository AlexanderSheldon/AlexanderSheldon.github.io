    <circle cx="704" cy="385" r="8"/><circle cx="751" cy="298" r="8"/><circle cx="808" cy="261" r="8"/>
    <circle cx="855" cy="342" r="8"/><circle cx="898" cy="247" r="8"/><circle cx="921" cy="383" r="8"/>
    <circle cx="996" cy="293" r="8"/><circle cx="1052" cy="365" r="8"/><circle cx="1027" cy="430" r="8"/>
    <circle cx="947" cy="475" r="8"/><circle cx="835" cy="463" r="8"/><circle cx="752" cy="433" r="8"/>
    <circle cx="795" cy="383" r="8"/><circle cx="972" cy="351" r="8"/>
  </g>
  <line x1="649" y1="514" x2="680" y2="514" stroke="#17645a" stroke-width="2"/>
  <text x="691" y="519" fill="#5d6966" font-family="Manrope, sans-serif" font-size="12">nested contours summarize density</text>
  <text x="58" y="600" fill="#5d6966" font-family="Manrope, sans-serif" font-size="12">Illustrative point pattern only. See the linked project page for the original maps and published outputs.</text>
